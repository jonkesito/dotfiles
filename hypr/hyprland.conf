# ==============================================================================
# 🚀 MI CONFIGURACIÓN BASE DE HYPRLAND
# ==============================================================================

# 🔑 TECLA MAESTRA (SUPER = Tecla Windows)
$mainMod = SUPER

# 📱 APLICACIONES PREDETERMINADAS
$terminal = wezterm
$menu = rofi -show drun

# 🎛️ CONFIGURACIÓN DEL MONITOR (Detecta tu pantalla automáticamente)
monitor=,preferred,auto,1

# 🧠 CONFIGURACIÓN DE ENTRADA (Teclado en Español)
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 1.5
    force_no_accel = true

     
    touchpad {
        natural_scroll = false
    }
}


# 🌑 FORZAR MODO OSCURO GLOBAL
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11
env = GTK_THEME,Adwaita:dark


# 🔄 CONFIGURACIÓN DEL PORTAL OSCURO AL ARRANQUE
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita:dark'

# 🎨 ESTÉTICA BÁSICA (Bordes Catppuccin y Esquinas Redondeadas)
general {
    gaps_in = 5                    # Espacio entre ventanas
    gaps_out = 10                  # Espacio entre ventanas y el borde de la pantalla
    border_size = 2
    col.active_border = rgb(89b4fa)   # Azul Catppuccin Mocha
    col.inactive_border = rgb(313244) # Gris oscuro Catppuccin Mocha
    layout = dwindle
}

decoration {
    rounding = 10                  # Esquinas redondeadas elegantes
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# 🔄 AUTO-ARRANQUE (Programas que se abren solos al iniciar)
# Quitamos el aviso amarillo molesto de Hyprland por defecto
exec-once = hyprctl setcursor Adwaita 24

# ⌨️ ATAJOS DE TECLADO ESENCIALES
bind = $mainMod, Q, exec, $terminal       # Abrir tu WezTerm enlazada
bind = $mainMod, C, killactive,           # Cerrar la ventana actual
bind = $mainMod, M, exit,                 # Salir de Hyprland (Volver a KDE/Login)
bind = $mainMod, E, exec, dolphin         # Abrir el gestor de archivos de KDE
bind = $mainMod, Space, exec, $menu       # Abrir el buscador de apps Rofi

# Mover el foco entre ventanas con SUPER + Flechas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Cambiar entre escritorios virtuales (Workspaces) del 1 al 5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Mover ventana activa a un escritorio virtual con SUPER + SHIFT + Número
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mover y redimensionar ventanas flotantes con el Ratón (SUPER + Clics)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

